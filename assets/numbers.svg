<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.45s" dur="0.5s" fill="freeze"/><text x="630" y="62" text-anchor="middle" fill="#fb4934" font-size="34" font-weight="800">30+</text><text x="630" y="90" text-anchor="middle" fill="#a89984" font-size="12">sites on one CMS</text></g>
